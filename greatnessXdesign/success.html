<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#061522"><title>Purchase Complete — Greatness by Design</title><link rel="icon" href="assets/brand-logo.jpg"><link rel="stylesheet" href="styles.css"></head><body><div class="grain"></div><header class="site-header"><a class="brand" href="index.html"><img src="assets/brand-logo.jpg" alt="Greatness by Design logo"><span>GREATNESS <b>BY DESIGN</b></span></a><nav class="nav"><a href="index.html">Home</a><a href="products.html">Digital Products</a><a href="blog.html">Journal</a></nav></header><main><section class="legal" id="purchase-state"><p class="eyebrow">PAYMENT CONFIRMED</p><h1>Your product is <em>ready.</em></h1><p id="status">Verifying your Stripe purchase…</p><div id="download-area"></div></section></main><footer class="footer"><div><div class="footer-brand">GREATNESS BY DESIGN</div><p>Ideas. Products. Execution.</p></div><div class="footer-links"><a href="index.html">Home</a><a href="products.html">Products</a><a href="blog.html">Journal</a></div><p class="copyright">© <span id="year"></span> Greatness by Design.</p></footer><script>
document.getElementById('year').textContent=new Date().getFullYear();const params=new URLSearchParams(location.search),sessionId=params.get('session_id'),status=document.getElementById('status'),area=document.getElementById('download-area');
async function verify(){if(!sessionId){status.textContent='No checkout session was supplied. Return to the product page to begin a purchase.';return;}try{const res=await fetch('/.netlify/functions/verify-purchase?session_id='+encodeURIComponent(sessionId));const data=await res.json();if(!res.ok)throw new Error(data.error||'Purchase verification failed.');status.textContent=`Thank you. ${data.product} has been unlocked.`;area.innerHTML=`<a class="btn btn-primary" href="${data.downloadUrl}" download="${data.filename}">Download your product →</a><p style="color:var(--muted);margin-top:18px">Keep this page or save the downloaded PDF. Your checkout receipt is handled by Stripe.</p>`;}catch(error){status.textContent=error.message;area.innerHTML='<a class="btn btn-ghost" href="products.html">Return to products</a>';}}verify();
</script></body></html>
